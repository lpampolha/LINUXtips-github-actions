name: "Nível 3: Containers e Segurança"

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - desafio-nivel-3

    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint do Dockerfile com Hadolint
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile > lint-report.txt 2>&1 || true
          if grep -q 'DL3006\|DL3008' lint-report.txt; then
            echo "::error::Falha no lint: DL3006 (Always tag versions) ou DL3008 (Pin versions) detectados"
            exit 1
          fi

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          tags: |
            ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}:${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}

      - name: Scan de vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
          output: trivy-report.txt

      - name: Publicar imagem no GHCR
        if: success()
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}:${{ github.sha }}

      - name: Upload de relatórios
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            lint-report.txt
            trivy-report.txt

  generate-certificate:
    name: "Desafio Nível 3 - Certificado"
    needs: [build-scan-and-push]
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: Gerar certificado
        run: |
          mkdir -p certificates
          cat > certificates/level-3-certificate.md << EOF
          # Certificado de Conclusão - Nível 3
          **Descomplicando Github Actions - GitHub Actions Edition**
          ---
          **Participante:** ${{ github.actor }}
          **Repositório:** ${{ github.repository }}
          **Commit:** ${{ github.sha }}
          **Data:** $(date +"%d/%m/%Y %H:%M:%S")
          
          ## Competências validadas:
          - Build seguro de imagens Docker
          - Análise estática de Dockerfile (Hadolint)
          - Varredura de vulnerabilidades (Trivy)
          - Publicação condicional no GHCR
          - Gestão de artefatos de segurança
          
          **Workflow ID:** ${{ github.run_id }}
          **Status:** Aprovado com sucesso
          ---
          *Emitido automaticamente via GitHub Actions*
          *LINUXtips | Supply Chain Security*
          EOF

      - name: Upload do certificado
        uses: actions/upload-artifact@v4
        with:
          name: level-3-certificate
          path: certificates/
          retention-days: 30
