name: Nível 3 - Containers e Segurança

on:
  pull_request:
    types: [closed]
    branches: [desafio-nivel-3]

jobs:
  build-scan-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile > lint-report.txt 2>&1 || true
          if grep -q 'DL3006\|DL3008' lint-report.txt; then
            echo "::error::Falha no lint: DL3006 ou DL3008 detectados"
            exit 1
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          tags: |
            ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}:${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          output: trivy-report.txt

      - name: Push to GHCR
        if: success()
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ lower(github.repository_owner) }}/${{ lower(vars.IMAGE_NAME) }}:${{ github.sha }}

      - name: Generate certificate
        run: |
          echo "# Certificado Nível 3 - Containers e Segurança" > level-3-certificate.md
          echo "**Data**: $(date +'%d/%m/%Y %H:%M')" >> level-3-certificate.md
          echo "**Commit**: ${{ github.sha }}" >> level-3-certificate.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            lint-report.txt
            trivy-report.txt
            level-3-certificate.md
